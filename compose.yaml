services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ledger
      DB_PASSWORD: ledger
    depends_on:
      db:
        condition: service_healthy

volumes:
  ledger-pg-data:
